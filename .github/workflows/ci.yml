name: Fardad CI

on:
  pull_request:
  push:
    branches:
      - main
      - architecture-refactor

permissions:
  contents: read

concurrency:
  group: fardad-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        env:
          DATABASE_URL: postgresql://fardad:fardad@localhost:5432/fardad_ci
          JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
          JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
          COMMERCE_STORE_KEY: fardad-ci
          COMMERCE_BFF_SHARED_SECRET: ci-only-commerce-secret
          STOREFRONT_API_BASE_URL: http://127.0.0.1:4000
        run: pnpm build
